<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Test Radar</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;color:#172a4a;background:#eef1f5}
main{max-width:620px;margin:0 auto;padding:40px 20px}
h1{margin:0 0 8px}p{color:#5b6170;line-height:1.5}
section{background:#fff;border:1px solid #dde2ea;border-radius:10px;padding:22px;margin-top:18px;min-height:340px}
button{background:#172a4a;color:#fff;border:0;border-radius:7px;padding:11px 16px;font:inherit;cursor:pointer}
</style>
</head>
<body>
<main>
  <h1>Page de test Radar</h1>
  <p id="st">Chargement…</p>
  <section><h2>Bloc 1</h2><p>Clique sur le bouton puis descends la page.</p><button type="button">Bouton de test</button></section>
  <section><h2>Bloc 2</h2><p>Encore un peu.</p></section>
  <section><h2>Bloc 3</h2><p>Fin de la page.</p></section>
</main>
<script>
(function () {
  var q = new URLSearchParams(location.search), site = q.get('site'), st = document.getElementById('st');
  if (!site) { st.textContent = "Ajoute ?site=ID_DE_LA_MAQUETTE à l'adresse."; return; }
  var s = document.createElement('script');
  s.src = '/t.js'; s.setAttribute('data-site', site);
  document.body.appendChild(s);
  st.textContent = 'Suivi actif pour la maquette ' + site + '. La visite apparaît dans le dashboard sous 10 secondes.';
})();
</script>
</body>
</html>
